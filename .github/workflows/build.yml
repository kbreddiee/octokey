name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C tests/host test

  firmware:
    name: firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub
          - name: hub-tembed   # LILYGO T-Embed all-in-one hub
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub
            sdkconfig_defaults: "sdkconfig.defaults;sdkconfig.tembed"
          - name: hub-headless # custom PCB: button + slot LEDs
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub
            sdkconfig_defaults: "sdkconfig.defaults;sdkconfig.headless"
          - name: hub-air      # Wi-Fi only: phone browser is the keyboard/mouse/switcher
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub-air
          - name: hub-tdeck    # LILYGO T-Deck/T-Deck Plus: onboard keyboard+trackball+screen
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub-tdeck
          - name: hub-dongle   # one stick = hub + dongle; the web installer ships this
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/hub-dongle
          - name: dongle
            target: esp32s2
            chip_family: ESP32-S2
            path: firmware/dongle
          - name: dongle-s3   # AtomS3U / T-Dongle-S3 form-factor boards
            target: esp32s3
            chip_family: ESP32-S3
            path: firmware/dongle
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: >
            idf.py ${{ matrix.sdkconfig_defaults &&
            format('-DSDKCONFIG_DEFAULTS="{0}"', matrix.sdkconfig_defaults)
            || '' }} build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin
            -o espkvm-${{ matrix.name }}-web.bin @flash_args

      # esp-idf-ci-action builds inside a container as root, so build/ comes
      # back owned by root and later steps running as `runner` cannot write
      # into it.
      - name: Take ownership of the container-built output
        run: sudo chown -R "$(id -u):$(id -g)" ${{ matrix.path }}/build

      - name: Generate ESP Web Tools manifest
        run: |
          VERSION="${GITHUB_REF_NAME}"
          python3 tools/gen_manifest.py \
            --name ${{ matrix.name }} \
            --chip ${{ matrix.chip_family }} \
            --version "${VERSION}" \
            --out ${{ matrix.path }}/build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: espkvm-${{ matrix.name }}
          path: |
            ${{ matrix.path }}/build/espkvm_*.bin
            ${{ matrix.path }}/build/espkvm-${{ matrix.name }}-web.bin
            ${{ matrix.path }}/build/manifest-${{ matrix.name }}.json
            ${{ matrix.path }}/build/bootloader/bootloader.bin
            ${{ matrix.path }}/build/partition_table/partition-table.bin

  # The dongle pack lets a hub flash T-Dongle-S3s through its own USB
  # port. Hub manifests get a second part writing the pack into the hub's
  # dimage partition (0x290000) in the same web-flash click.
  pack:
    name: dongle provisioning pack
    needs: [firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build pack and hub manifests
        run: |
          python3 tools/gen_dongle_pack.py \
            --image dist/espkvm-dongle-s3/espkvm-dongle-s3-web.bin \
            --out dist/espkvm-dongle-pack.bin
          for hub in hub hub-tembed hub-headless; do
            python3 tools/gen_manifest.py \
              --name "$hub" --chip ESP32-S3 \
              --version "${GITHUB_REF_NAME}" \
              --extra-part espkvm-dongle-pack.bin:0x290000 \
              --out dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: espkvm-webflash
          path: |
            dist/espkvm-dongle-pack.bin
            dist/manifest-*.json

  release:
    name: attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/espkvm-hub/espkvm-hub-web.bin
            dist/espkvm-hub-tembed/espkvm-hub-tembed-web.bin
            dist/espkvm-hub-headless/espkvm-hub-headless-web.bin
            dist/espkvm-hub-air/espkvm-hub-air-web.bin
            dist/espkvm-hub-air/manifest-hub-air.json
            dist/espkvm-hub-tdeck/espkvm-hub-tdeck-web.bin
            dist/espkvm-hub-tdeck/manifest-hub-tdeck.json
            dist/espkvm-hub-dongle/espkvm-hub-dongle-web.bin
            dist/espkvm-hub-dongle/manifest-hub-dongle.json
            dist/espkvm-dongle/espkvm-dongle-web.bin
            dist/espkvm-dongle/manifest-dongle.json
            dist/espkvm-dongle-s3/espkvm-dongle-s3-web.bin
            dist/espkvm-dongle-s3/manifest-dongle-s3.json
            dist/espkvm-webflash/espkvm-dongle-pack.bin
            dist/espkvm-webflash/manifest-hub.json
            dist/espkvm-webflash/manifest-hub-tembed.json
            dist/espkvm-webflash/manifest-hub-headless.json
