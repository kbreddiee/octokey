<!DOCTYPE html>
<!--
  OctoKey — phone control surface.

  Talks to the hub over one WebSocket at /ws. Wire format (JSON, both
  directions — kept here so the protocol and the code that speaks it
  never drift apart; mirrored in ../webui.c):

    phone -> hub
      {"t":"hello"}                                  request a fresh slots snapshot
      {"t":"kbd","m":<u8 mods>,"k":[u8 x up to 6]}    keyboard state (HID usage codes)
      {"t":"mouse","dx":i16,"dy":i16,"b":u8,"w":i8}   relative move / buttons / wheel
      {"t":"cons","u":u16}                            consumer usage, 0 = release
      {"t":"switch","slot":u8}                        make a paired slot active
      {"t":"pair"} / {"t":"cancel"}                   pairing mode on/off
      {"t":"unpair","slot":u8}                         forget a slot

    hub -> phone
      {"t":"slots","active":u8,"pairing":bool,
       "slots":[{"n":u8,"name":str,"online":bool}, ...]}
      {"t":"msg","text":str}                          toast

  mods bit layout (matches kvm_proto.h): bit0 LCtrl, bit1 LShift,
  bit2 LAlt, bit3 LGui/Win, bit4 RCtrl, bit5 RShift, bit6 RAlt, bit7 RGui.

  Custom scripts are stored in the browser (localStorage) — no device
  storage is involved, so they live on the phone that created them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>OctoKey</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
  /* shadcn-style light theme, zinc neutrals + OctoKey crimson.
   * Schematic trim: engineering-paper dot grid, hairline rules, and
   * monospaced micro-labels. */
  :root {
    --background: #ffffff;
    --foreground: #09090b;      /* zinc-950 */
    --card: #ffffff;
    --muted: #f4f4f5;           /* zinc-100 */
    --muted-2: #e4e4e7;         /* zinc-200 */
    --muted-fg: #71717a;        /* zinc-500 */
    --faint: #a1a1aa;           /* zinc-400 */
    --border: #e4e4e7;
    --primary: #a91e35;         /* the emblem's crimson */
    --primary-hover: #8d1a2c;
    --primary-fg: #fafafa;
    --primary-soft: #fdf2f4;
    --primary-line: #f0c9d1;
    --good: #16a34a;
    --good-soft: #f0fdf4;
    --warn: #b45309;
    --radius: 8px;
    --radius-sm: 6px;
    --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: none; }
  body {
    background-color: var(--background);
    /* engineering-paper grid */
    background-image: radial-gradient(circle, var(--muted-2) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--foreground);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding-bottom: var(--safe-b);
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .ic svg, .icon-btn svg { display: block; }
  svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2;
        fill: none; stroke-linecap: round; stroke-linejoin: round; }
  svg.fill { fill: currentColor; stroke: none; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }

  /* ---------------- header ---------------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; flex: none;
    background: var(--card); border-bottom: 1px solid var(--border);
    position: relative;
  }
  /* schematic hairline under the header */
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: repeating-linear-gradient(90deg, var(--primary-line) 0 7px, transparent 7px 14px);
  }
  header .logo { width: 30px; height: 30px; flex: none; }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none;
    transition: background .18s, box-shadow .18s;
  }
  header .dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(22,163,74,.14); }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -.2px; flex: 1; }
  header .hint { font-size: 12px; color: var(--muted-fg); min-height: 15px; text-align: right; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------------- shared ---------------- */
  .empty { text-align: center; color: var(--faint); padding: 34px 14px; font-size: 14px; }
  .btn-primary {
    background: var(--primary); color: var(--primary-fg); border: none;
    border-radius: var(--radius); padding: 13px; font-size: 15px; font-weight: 600;
    min-height: 46px; transition: background .15s, transform .1s;
  }
  .btn-primary:active { background: var(--primary-hover); transform: scale(.985); }
  .btn-danger {
    background: var(--card); color: var(--primary); border: 1px solid var(--primary-line);
    border-radius: var(--radius); padding: 11px 16px; font-size: 14px; font-weight: 600;
    min-height: 44px; transition: background .15s;
  }
  .btn-danger:active { background: var(--primary-soft); }
  .btn-ghost {
    background: var(--card); color: var(--foreground); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; font-size: 14px; font-weight: 600;
    min-height: 44px; transition: background .15s, border-color .15s;
  }
  .btn-ghost:active { background: var(--muted); border-color: var(--faint); }
  .btn-ghost.sm { padding: 8px 12px; min-height: 38px; font-size: 13px; }
  .icon-btn {
    background: transparent; border: none; color: var(--faint);
    width: 44px; height: 44px; border-radius: var(--radius); flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .icon-btn:active { background: var(--muted); color: var(--foreground); }
  .icon-btn.danger:active { color: var(--primary); background: var(--primary-soft); }
  .linkbtn { background: none; border: none; color: var(--muted-fg); font-size: 13px;
             padding: 10px; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------------- Devices ---------------- */
  #view-devices { padding: 14px; gap: 10px; overflow-y: auto; touch-action: pan-y; }
  #pairBtn { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #pairBtn svg { width: 20px; height: 20px; }
  .slot {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 12px; min-height: 60px;
    transition: border-color .15s, background .15s;
  }
  .slot.active { border-color: var(--primary); background: var(--primary-soft); }
  .slot .num {
    width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; flex: none; font-size: 15px; color: var(--muted-fg);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .slot.active .num { background: var(--primary); color: var(--primary-fg); }
  .slot .info { flex: 1; min-width: 0; }
  .slot .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .status { font-size: 12px; color: var(--faint); display: flex; align-items: center;
                  gap: 6px; margin-top: 2px; }
  .slot .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .slot .status.online { color: var(--good); }
  .slot .status.online::before { background: var(--good); }
  #pairing {
    display: none; text-align: center; padding: 14px; color: var(--muted-fg);
    background: var(--primary-soft); border: 1px dashed var(--primary-line);
    border-radius: var(--radius); font-size: 14px;
  }
  #pairing button { margin-top: 10px; }

  /* ---------------- Touchpad ---------------- */
  #view-pad { padding: 12px; gap: 10px; }
  #pad, #typepad {
    flex: 1; background: var(--card); border: 1px dashed var(--primary-line);
    border-radius: var(--radius); position: relative; overflow: hidden;
  }
  #typepad { min-height: 64px; }
  /* schematic crosshair in the middle of the big pad */
  #pad::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    transform: translate(-50%, -50%); pointer-events: none; opacity: .5;
    background:
      linear-gradient(var(--primary-line) 0 0) center/1px 100% no-repeat,
      linear-gradient(var(--primary-line) 0 0) center/100% 1px no-repeat;
  }
  #pad::after {
    content: "tap = click   \2022   two fingers = scroll / right-click";
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    color: var(--faint); font-size: 12px; pointer-events: none;
  }
  .padrow { display: flex; gap: 8px; flex: none; }
  .padrow button {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    color: var(--foreground); border-radius: var(--radius); padding: 13px 0;
    font-size: 14px; min-height: 48px; transition: background .12s, border-color .12s, color .12s;
  }
  .padrow button:active, .padrow button.down {
    background: var(--primary); border-color: var(--primary); color: var(--primary-fg);
  }
  .sens { display: flex; align-items: center; gap: 10px; color: var(--muted-fg);
          font-size: 12px; flex: none; padding: 0 2px; }
  .sens input { flex: 1; accent-color: var(--primary); }

  /* ---------------- Keys ---------------- */
  #view-kbd { padding: 8px; gap: 6px; overflow-y: auto; touch-action: pan-y; }
  .krow { display: flex; gap: 5px; }
  .key {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    color: var(--foreground); border-radius: var(--radius-sm); padding: 13px 2px;
    font-size: 13px; text-align: center; min-width: 0; min-height: 44px;
    transition: background .1s, border-color .1s, color .1s;
  }
  .key:active, .key.down { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  .key.wide { flex: 1.7; }
  .key.space { flex: 6; }
  .key.small { font-size: 11px; color: var(--muted-fg); }
  .key.small:active, .key.small.down { color: var(--primary-fg); }
  .krow.media { margin-top: 2px; }

  /* ---------------- slot bar ---------------- */
  .slotbar { display: flex; gap: 5px; flex: none; }
  .slotbar .chip {
    flex: 1; padding: 10px 0; border-radius: var(--radius-sm); text-align: center;
    font-weight: 700; font-size: 14px; min-width: 0; min-height: 42px;
    background: var(--muted); border: 1px solid var(--border); color: var(--faint);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    transition: background .14s, border-color .14s, color .14s;
  }
  /* paired-but-idle = crimson, active = green — same code the dongle's
   * own screen uses, so the two never disagree */
  .slotbar .chip.paired { background: var(--card); color: var(--primary); border-color: var(--primary-line); }
  .slotbar .chip.on { color: #fff; background: var(--good); border-color: var(--good); }

  /* ---------------- Type ---------------- */
  #view-type { padding: 8px; gap: 7px; }
  #typebox {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--foreground); border-radius: var(--radius); padding: 13px 12px;
    font-size: 16px;   /* >=16px stops iOS zooming in on focus */
    user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  #typebox::placeholder { color: var(--faint); }
  #typebox:focus { outline: none; border-color: var(--primary);
                   box-shadow: 0 0 0 3px rgba(169,30,53,.12); }

  /* ---------------- Script manager ---------------- */
  #view-script { overflow: hidden; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column;
          gap: 10px; padding: 12px; overflow-y: auto; touch-action: pan-y; }
  .pane[hidden] { display: none; }
  .pane-head { display: flex; align-items: center; gap: 8px; flex: none; }
  .pane-title { font-size: 12px; font-weight: 700; flex: 1; color: var(--muted-fg);
                text-transform: uppercase; letter-spacing: .09em;
                font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  #scriptCards { display: flex; flex-direction: column; gap: 8px; }
  .scard {
    display: flex; align-items: center; gap: 4px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 8px 8px 13px;
    transition: border-color .15s;
  }
  .scard:active { border-color: var(--faint); }
  .scard-main { flex: 1; min-width: 0; padding: 6px 0; }
  .scard-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scard-meta { font-size: 12px; color: var(--faint); margin-top: 2px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .scard-run {
    display: flex; align-items: center; gap: 6px; flex: none;
    background: var(--primary); color: var(--primary-fg); border: none;
    border-radius: var(--radius); padding: 0 14px; height: 44px;
    font-size: 14px; font-weight: 600; transition: background .15s, transform .1s;
  }
  .scard-run svg { width: 14px; height: 14px; }
  .scard-run:active { background: var(--primary-hover); transform: scale(.97); }

  .fld { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .fld > span { font-size: 11px; color: var(--muted-fg); font-weight: 700;
                text-transform: uppercase; letter-spacing: .09em;
                font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .fld.grow { flex: 1; min-height: 0; }
  #edName {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--foreground); border-radius: var(--radius); padding: 12px;
    font-size: 16px; user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  #edBody {
    width: 100%; flex: 1; min-height: 130px; resize: none;
    background: var(--card); border: 1px solid var(--border); color: var(--foreground);
    border-radius: var(--radius); padding: 12px;
    font: 13px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
    user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  #edName::placeholder, #edBody::placeholder { color: var(--faint); }
  #edName:focus, #edBody:focus { outline: none; border-color: var(--primary);
                                 box-shadow: 0 0 0 3px rgba(169,30,53,.12); }
  .hint { color: var(--muted-fg); font-size: 11px; line-height: 1.7; flex: none; }
  .hint code { color: var(--primary); background: var(--primary-soft);
               border: 1px solid var(--primary-line);
               padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .ed-actions { display: flex; gap: 10px; flex: none; margin-top: 2px; }
  .ed-actions .btn-primary { flex: 1; }

  .runbar {
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 10px 12px; background: var(--primary-soft);
    border-top: 1px solid var(--primary-line);
  }
  .runbar[hidden] { display: none; }
  .runbar.err .runstat { color: var(--primary); font-weight: 600; }
  .runstat { flex: 1; min-width: 0; font-size: 13px; color: var(--muted-fg);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
             font-variant-numeric: tabular-nums;
             font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .runbar .btn-danger { padding: 8px 14px; min-height: 40px; background: var(--card); }

  /* ---------------- bottom nav ---------------- */
  nav { display: flex; border-top: 1px solid var(--border); flex: none; background: var(--card); }
  nav button {
    flex: 1; background: none; color: var(--faint); border: none;
    padding: 8px 0 calc(8px + var(--safe-b)); font-size: 11px; font-weight: 600;
    min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color .15s;
  }
  nav button .ic { display: flex; }
  nav button.active { color: var(--primary); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="/logo.png" alt="" width="30" height="30">
  <span class="dot" id="dot"></span>
  <h1>OctoKey</h1>
  <span class="hint" id="hint" role="status" aria-live="polite">connecting…</span>
</header>

<main>
  <section id="view-devices" class="view active">
    <button id="pairBtn" class="btn-primary">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Pair a new dongle
    </button>
    <div id="pairing">
      Pairing mode active on the hub — press <b>BOOT</b> on the dongle now.
      <div><button id="cancelPairBtn" class="btn-ghost sm">Cancel</button></div>
    </div>
    <div id="slots"></div>
    <div id="empty" class="empty">No dongles paired yet.</div>
  </section>

  <section id="view-pad" class="view">
    <div id="pad"></div>
    <div class="padrow">
      <button id="btnLeft">Left</button>
      <button id="btnMid">Middle</button>
      <button id="btnRight">Right</button>
    </div>
    <div class="padrow">
      <button data-scroll="-3">Scroll ▲</button>
      <button data-scroll="3">Scroll ▼</button>
    </div>
    <div class="sens">
      <span>slow</span><input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1.2"><span>fast</span>
    </div>
  </section>

  <section id="view-type" class="view">
    <div id="slotbar" class="slotbar"></div>
    <div id="typepad"></div>
    <div class="krow">
      <button class="key small" data-xkey="29">esc</button>
      <button class="key small" data-xkey="2b">tab</button>
      <button class="key small" data-xmod="1">ctrl</button>
      <button class="key small" data-xmod="4">alt</button>
      <button class="key small" data-xmod="8">win</button>
      <button class="key small" data-xkey="4c">del</button>
      <button class="key small" data-xkey="50">&larr;</button>
      <button class="key small" data-xkey="51">&darr;</button>
      <button class="key small" data-xkey="52">&uarr;</button>
      <button class="key small" data-xkey="4f">&rarr;</button>
    </div>
    <input id="typebox" type="text" placeholder="tap here, then type"
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="enter">
  </section>

  <section id="view-script" class="view">
    <!-- list pane -->
    <div id="scriptList" class="pane">
      <div id="scriptbar" class="slotbar"></div>
      <div class="pane-head">
        <span class="pane-title">Scripts</span>
        <button id="newScriptBtn" class="btn-ghost sm">＋ New</button>
      </div>
      <div id="scriptCards"></div>
      <div id="scriptsEmpty" class="empty">No scripts yet — tap <b>＋ New</b> to create one.</div>
      <button id="restoreBtn" class="linkbtn">Restore example scripts</button>
    </div>
    <!-- editor pane -->
    <div id="scriptEditor" class="pane" hidden>
      <div class="pane-head">
        <button id="edBack" class="icon-btn" aria-label="Back to list">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="pane-title" id="edTitle">New script</span>
      </div>
      <label class="fld" for="edName"><span>Name</span></label>
      <input id="edName" type="text" placeholder="e.g. Workstation FC1 cert"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <label class="fld grow" for="edBody"><span>Steps</span>
        <textarea id="edBody" spellcheck="false" autocomplete="off"
                  autocapitalize="off" autocorrect="off"
                  placeholder="# one step per line&#10;key ctrl+alt+f2&#10;wait 1500&#10;type your-username&#10;enter"></textarea>
      </label>
      <div class="hint">
        <code>type &lt;text&gt;</code> · <code>key ctrl+alt+f4</code> ·
        <code>enter</code>/<code>tab</code>/<code>esc</code> ·
        <code>wait &lt;ms&gt;</code> · <code># comment</code>
      </div>
      <div class="ed-actions">
        <button id="edDelete" class="btn-danger" hidden>Delete</button>
        <button id="edSave" class="btn-primary">Save</button>
      </div>
    </div>
    <!-- run status (shared) -->
    <div id="runBar" class="runbar" hidden>
      <span id="runStat" class="runstat" role="status" aria-live="polite"></span>
      <button id="stopBtn" class="btn-danger">■ Stop</button>
    </div>
  </section>

  <section id="view-kbd" class="view">
    <div class="krow">
      <button class="key small" data-code="29">esc</button>
      <button class="key small" data-code="3a">F1</button>
      <button class="key small" data-code="3b">F2</button>
      <button class="key small" data-code="3c">F3</button>
      <button class="key small" data-code="3d">F4</button>
      <button class="key small" data-code="3e">F5</button>
      <button class="key small" data-code="3f">F6</button>
      <button class="key small" data-code="40">F7</button>
      <button class="key small" data-code="41">F8</button>
      <button class="key small" data-code="42">F9</button>
      <button class="key small" data-code="43">F10</button>
      <button class="key small" data-code="44">F11</button>
      <button class="key small" data-code="45">F12</button>
    </div>
    <div class="krow">
      <button class="key" data-code="35">`</button>
      <button class="key" data-code="1e">1</button>
      <button class="key" data-code="1f">2</button>
      <button class="key" data-code="20">3</button>
      <button class="key" data-code="21">4</button>
      <button class="key" data-code="22">5</button>
      <button class="key" data-code="23">6</button>
      <button class="key" data-code="24">7</button>
      <button class="key" data-code="25">8</button>
      <button class="key" data-code="26">9</button>
      <button class="key" data-code="27">0</button>
      <button class="key" data-code="2d">-</button>
      <button class="key" data-code="2e">=</button>
      <button class="key wide" data-code="2a">&larr;bksp</button>
    </div>
    <div class="krow">
      <button class="key wide" data-code="2b">tab</button>

<script>
'use strict';

/* ---------------- connection ---------------- */
let ws, connected = false;
const dot = document.getElementById('dot'), hint = document.getElementById('hint');

function connect() {
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => { connected = true; dot.classList.add('on'); hint.textContent = ''; send({t:'hello'}); };
  ws.onclose = () => { connected = false; dot.classList.remove('on'); hint.textContent = 'reconnecting…'; setTimeout(connect, 1200); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => { try { onServerMsg(JSON.parse(ev.data)); } catch (e) {} };
}
function send(o) { if (connected) ws.send(JSON.stringify(o)); }
connect();

/* ---------------- toasts ---------------- */
function toast(text) {
  hint.textContent = text;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { hint.textContent = ''; }, 2500);
}

/* ---------------- Devices tab ---------------- */
const slotsEl = document.getElementById('slots');
const emptyEl = document.getElementById('empty');
const pairingEl = document.getElementById('pairing');

function onServerMsg(m) {
  if (m.t === 'slots') { lastSlots = m; renderSlots(m); renderSlotBar(); }
  else if (m.t === 'msg') toast(m.text);
}

function renderSlots(m) {
  pairingEl.style.display = m.pairing ? 'block' : 'none';
  slotsEl.innerHTML = '';
  emptyEl.style.display = m.slots.length ? 'none' : 'block';
  for (const s of m.slots) {
    const row = document.createElement('div');
    row.className = 'slot' + (s.n === m.active ? ' active' : '');
    row.innerHTML =
      '<div class="num">' + s.n + '</div>' +
      '<div class="info"><div class="name"></div>' +
      '<div class="status' + (s.online ? ' online' : '') + '">' + (s.online ? 'online' : 'offline') + '</div></div>' +
      '<button class="icon-btn danger forget" aria-label="Forget device">' +
      '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    row.querySelector('.name').textContent = s.name;
    row.querySelector('.info').onclick = () => send({t:'switch', slot: s.n});
    row.querySelector('.forget').onclick = (ev) => {
      ev.stopPropagation();
      if (confirm('Forget "' + s.name + '"?')) send({t:'unpair', slot: s.n});
    };
    slotsEl.appendChild(row);
  }
}

document.getElementById('pairBtn').onclick = () => send({t:'pair'});
document.getElementById('cancelPairBtn').onclick = () => send({t:'cancel'});

/* ---------------- tab switching ---------------- */
for (const btn of document.querySelectorAll('nav button')) {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    /* still inside the tap gesture, so focus() opens the keyboard */
    if (btn.dataset.view === 'type') document.getElementById('typebox').focus();
  };
}

/* ---------------- Keyboard tab ---------------- */
let mods = 0;
const MOD_LABEL = {1:'ctrl', 2:'shift', 4:'alt', 8:'win'};

document.querySelectorAll('.key.mod').forEach(k => {
  const bit = parseInt(k.dataset.mod, 10);
  k.addEventListener('click', () => {
    mods ^= bit;
    document.querySelectorAll('.key.mod[data-mod="' + bit + '"]').forEach(el => el.classList.toggle('down', !!(mods & bit)));
    send({t:'kbd', m: mods, k: []});
  });
});

document.querySelectorAll('.key[data-code]').forEach(k => {
  const code = parseInt(k.dataset.code, 16);
  k.addEventListener('touchstart', (e) => { e.preventDefault(); pressKey(k, code); }, {passive: false});
  k.addEventListener('mousedown', (e) => { e.preventDefault(); pressKey(k, code); });
});

function pressKey(el, code) {
  el.classList.add('down');
  send({t:'kbd', m: mods, k: [code]});
  setTimeout(() => {
    el.classList.remove('down');
    send({t:'kbd', m: mods, k: []});
  }, 55);
}

document.querySelectorAll('.key[data-cons]').forEach(k => {
  const usage = parseInt(k.dataset.cons, 16);
  const fire = (e) => {
    e.preventDefault();
    k.classList.add('down');
    send({t:'cons', u: usage});
    setTimeout(() => { k.classList.remove('down'); send({t:'cons', u: 0}); }, 80);
  };
  k.addEventListener('touchstart', fire, {passive: false});
  k.addEventListener('mousedown', fire);
});

/* ---------------- Type tab (phone's native keyboard) ----------------
 * A real <input> summons the iOS/Android keyboard. Android IMEs (Gboard)
 * compose text instead of sending key events, so typing is captured by
 * diffing the input's value on every 'input' event and replaying the
 * delta as HID keystrokes — deletions become backspaces, additions
 * become char taps. Autocorrect/swipe "replace word" edits come out
 * right automatically. The 0-9 bar and the esc/tab/... row use
 * pointerdown+preventDefault so tapping them never blurs the input
 * (blur would dismiss the keyboard). */

let lastSlots = null;
const typebox = document.getElementById('typebox');

function renderSlotBar() {
  const bySlot = {};
  if (lastSlots) for (const s of lastSlots.slots) bySlot[s.n] = s;
  document.querySelectorAll('.slotbar').forEach(bar => {
    bar.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const chip = document.createElement('button');
      chip.textContent = i;
      chip.className = 'chip' +
        (!bySlot[i] ? '' : i === lastSlots.active ? ' on' : ' paired');
      chip.addEventListener('pointerdown', (e) => {
        e.preventDefault();               /* keep the keyboard open */
        if (bySlot[i]) send({t:'switch', slot: i});
      });
      bar.appendChild(chip);
    }
  });
}
renderSlotBar();

/* char -> [HID usage, shift] (US layout, mirrors what the dongle types) */
const BASE_CH = {'-':0x2d,'=':0x2e,'[':0x2f,']':0x30,'\\':0x31,';':0x33,
                 "'":0x34,'`':0x35,',':0x36,'.':0x37,'/':0x38,' ':0x2c};
const SHIFT_CH = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7',
                  '*':'8','(':'9',')':'0','_':'-','+':'=','{':'[','}':']',
                  '|':'\\',':':';','"':"'",'~':'`','<':',','>':'.','?':'/'};
function hidForChar(ch) {
  if (ch >= 'a' && ch <= 'z') return [0x04 + ch.charCodeAt(0) - 97, 0];
  if (ch >= 'A' && ch <= 'Z') return [0x04 + ch.charCodeAt(0) - 65, 2];
  if (ch >= '1' && ch <= '9') return [0x1e + ch.charCodeAt(0) - 49, 0];
  if (ch === '0') return [0x27, 0];
  if (ch === '\n') return [0x28, 0];
  if (ch === '\t') return [0x2b, 0];
  if (BASE_CH[ch] !== undefined) return [BASE_CH[ch], 0];
  if (SHIFT_CH[ch]) return [hidForChar(SHIFT_CH[ch])[0], 2];
  return null;                            /* emoji & friends: dropped */
}

/* Serialize press/release pairs so a swiped word arrives in order. */
const keyq = [];
let qbusy = false;
function queueKey(code, m) {
  keyq.push([code, m]);
  if (!qbusy) pumpq();
}
function pumpq() {
  if (!keyq.length) { qbusy = false; return; }
  qbusy = true;
  const [code, m] = keyq.shift();
  send({t:'kbd', m: m, k: [code]});
  setTimeout(() => { send({t:'kbd', m: 0, k: []}); pumpq(); }, 30);
}

/* ctrl/alt/win are one-shot: held for exactly the next keystroke. */
let oneshot = 0;
function takeMods() {
  const m = oneshot;
  oneshot = 0;
  document.querySelectorAll('[data-xmod]').forEach(b => b.classList.remove('down'));
  return m;
}
document.querySelectorAll('[data-xmod]').forEach(b => {
  const bit = parseInt(b.dataset.xmod, 10);
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    oneshot ^= bit;
    b.classList.toggle('down', !!(oneshot & bit));
  });
});
document.querySelectorAll('[data-xkey]').forEach(b => {
  const code = parseInt(b.dataset.xkey, 16);
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    b.classList.add('down');
    setTimeout(() => b.classList.remove('down'), 120);
    queueKey(code, takeMods());
  });
});

let prevVal = '';
typebox.addEventListener('input', () => {
  const v = typebox.value;
  let p = 0;
  while (p < prevVal.length && p < v.length && prevVal[p] === v[p]) p++;
  for (let i = p; i < prevVal.length; i++) queueKey(0x2a, 0);      /* bksp */
  for (const ch of v.slice(p)) {
    const h = hidForChar(ch);
    if (h) queueKey(h[0], h[1] | takeMods());
  }
  prevVal = v;
});

typebox.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;   /* IME is composing */
  const SPECIAL = {Enter:0x28, Escape:0x29, ArrowLeft:0x50, ArrowRight:0x4f,
                   ArrowUp:0x52, ArrowDown:0x51, Delete:0x4c, Home:0x4a,
                   End:0x4d, PageUp:0x4b, PageDown:0x4e};
  if (e.key === 'Backspace') {
    /* only when the box is empty — otherwise the input diff sends it */
    if (typebox.value === '') { e.preventDefault(); queueKey(0x2a, takeMods()); }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    queueKey(0x2b, takeMods());
  } else if (SPECIAL[e.key]) {
    e.preventDefault();
    queueKey(SPECIAL[e.key], takeMods());
  }
});

/* Trim the box once it grows, so long sessions don't build a novel in
 * it; done between words (trailing space) to stay out of the IME's way. */
typebox.addEventListener('input', () => {
  if (typebox.value.length > 40 && typebox.value.endsWith(' ')) {
    typebox.value = '';
    prevVal = '';
  }
});
typebox.addEventListener('blur', () => { typebox.value = ''; prevVal = ''; });

/* ---------------- Script tab (keystroke injection) ----------------
 * A tiny line-based macro language played into the active slot over the
 * same {t:'kbd'} protocol. One step per line:
 *     type <text>        literal text, char by char
 *     key ctrl+alt+f4    a chord: modifiers held while one key is tapped
 *     enter / tab / esc  a bare named key (any name from KEYNAME below)
 *     wait <ms>          pause (e.g. for a prompt to appear)
 *     # ...              comment (blank lines ignored too)
 * Nothing is sent to the firmware that a manual keypress couldn't send —
 * this just automates the timing so multi-step console flows don't have
 * to be typed by hand. Saved scripts live in the phone's localStorage. */

const KEYNAME = {
  enter:0x28, ret:0x28, return:0x28, tab:0x2b, esc:0x29, escape:0x29,
  space:0x2c, spc:0x2c, backspace:0x2a, bksp:0x2a, del:0x4c, delete:0x4c,
  ins:0x49, insert:0x49, home:0x4a, end:0x4d, pgup:0x4b, pageup:0x4b,
  pgdn:0x4e, pagedown:0x4e, up:0x52, down:0x51, left:0x50, right:0x4f,
  f1:0x3a,f2:0x3b,f3:0x3c,f4:0x3d,f5:0x3e,f6:0x3f,f7:0x40,f8:0x41,
  f9:0x42,f10:0x43,f11:0x44,f12:0x45,
};
const MODNAME = {ctrl:1, control:1, ctl:1, shift:2, alt:4, opt:4, option:4,
                 win:8, gui:8, cmd:8, meta:8, super:8};

/* "ctrl+alt+f4" / "a" / "enter" -> [mods, hidCode] (code null = none) */
function parseCombo(arg) {
  let mods = 0, code = null;
  for (let part of arg.split('+')) {
    part = part.trim().toLowerCase();
    if (!part) continue;
    if (MODNAME[part] !== undefined) { mods |= MODNAME[part]; continue; }
    if (KEYNAME[part] !== undefined) { code = KEYNAME[part]; continue; }
    if (part.length === 1) {
      const h = hidForChar(part);
      if (h) { code = h[0]; mods |= h[1]; }
    }
  }
  return [mods, code];
}

/* ---- runner ---- */
const runBar = document.getElementById('runBar');
const runStat = document.getElementById('runStat');
const stopBtn = document.getElementById('stopBtn');
let scriptRunning = false, scriptAbort = false;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function waitAbortable(ms) {
  const end = Date.now() + ms;
  while (Date.now() < end && !scriptAbort) await sleep(Math.min(80, end - Date.now()));
}
async function tap(mods, code) {
  send({t:'kbd', m: mods, k: code != null ? [code] : []});
  await sleep(55);
  send({t:'kbd', m: 0, k: []});
  await sleep(45);
}
async function typeText(text) {
  for (const ch of text) {
    if (scriptAbort) return;
    const h = hidForChar(ch);
    if (h) await tap(h[1], h[0]);   /* unknown chars (emoji) skipped */
  }
}

async function runBody(body, label) {
  const lines = body.split('\n');
  scriptRunning = true; scriptAbort = false;
  runBar.hidden = false; runBar.classList.remove('err');
  runStat.textContent = 'running ' + (label || 'script') + '…';

  let step = 0, err = null;
  const total = lines.filter(l => l.trim() && !l.trim().startsWith('#')).length;
  for (let ln = 0; ln < lines.length && !scriptAbort; ln++) {
    const raw = lines[ln].trim();
    if (!raw || raw[0] === '#') continue;
    step++;
    const sp = raw.search(/\s/);
    const cmd = (sp < 0 ? raw : raw.slice(0, sp)).toLowerCase();
    const arg = sp < 0 ? '' : raw.slice(sp + 1);
    runStat.textContent = step + '/' + total + '  ' + raw.slice(0, 38);
    if (cmd === 'type') {
      await typeText(arg);
    } else if (cmd === 'wait' || cmd === 'delay' || cmd === 'sleep') {
      await waitAbortable(parseInt(arg, 10) || 0);
    } else if (cmd === 'key' || cmd === 'press') {
      const [m, code] = parseCombo(arg);
      if (code == null && !m) { err = 'line ' + (ln+1) + ': bad key "' + arg + '"'; break; }
      await tap(m, code);
    } else if (KEYNAME[cmd] !== undefined && !arg) {
      await tap(0, KEYNAME[cmd]);
    } else {
      err = 'line ' + (ln+1) + ': unknown "' + cmd + '"';
      break;
    }
  }
  send({t:'kbd', m: 0, k: []});      /* make sure nothing is left held */
  scriptRunning = false;
  if (err) { runStat.textContent = err; runBar.classList.add('err'); }
  else { runStat.textContent = scriptAbort ? 'stopped' : 'done ✓'; }
  setTimeout(() => { if (!scriptRunning) runBar.hidden = true; }, err ? 4000 : 1600);
}

function startRun(body, label) {
  if (scriptRunning) return;
  if (!body.trim()) { toast('script is empty'); return; }
  const active = lastSlots ? lastSlots.active : 255;
  if (active === 255) { toast('pick a target slot first'); return; }
  runBody(body, label);
}
stopBtn.addEventListener('click', () => { scriptAbort = true; });

/* ---- store (localStorage) ---- */
/* Storage key predates the OctoKey rename and must NOT be changed:
 * it would orphan every script already saved on someone's phone. */
const LS_KEY = 'espkvm.scripts.v1';
/* Starter examples only. Keep these generic: whatever ships here lands on
 * every install, so real hostnames and credentials belong in scripts you
 * create on your own phone, never in this list. */
const CONSOLE_LOGIN =
  '# Log in at a text console, then run a command.\n' +
  '# Replace the placeholders before running this.\n' +
  'key ctrl+alt+f2\n' +
  'wait 2000\n' +
  'type your-username\n' +
  'enter\n' +
  'wait 800\n' +
  'type your-password\n' +
  'enter\n' +
  'wait 1500\n' +
  'type uname -a\n' +
  'enter\n';
const BUILTINS = [
  {name: 'Console login (example)', body: CONSOLE_LOGIN},
  {name: 'Open Run (Win)',          body: 'key win+r\nwait 400\n'},
  {name: 'Ctrl+Alt+Del',            body: 'key ctrl+alt+delete\n'},
];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function seedCopies() { return BUILTINS.map(b => ({id: uid(), name: b.name, body: b.body})); }
function loadScripts() {
  try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch (e) {}
  const seed = seedCopies();
  try { localStorage.setItem(LS_KEY, JSON.stringify(seed)); } catch (e) {}
  return seed;
}
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(scripts)); } catch (e) {} }
let scripts = loadScripts();

/* ---- list UI ---- */
const listPane = document.getElementById('scriptList');
const editorPane = document.getElementById('scriptEditor');
const cardsEl = document.getElementById('scriptCards');
const scriptsEmpty = document.getElementById('scriptsEmpty');
const PLAY = '<svg class="fill" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';

function stepSummary(body) {
  const steps = body.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
  const first = steps[0] || 'empty';
  return steps.length + (steps.length === 1 ? ' step · ' : ' steps · ') + first.slice(0, 30);
}

function renderScriptList() {
  cardsEl.innerHTML = '';
  scriptsEmpty.style.display = scripts.length ? 'none' : 'block';
  for (const s of scripts) {
    const card = document.createElement('div');
    card.className = 'scard';

    const main = document.createElement('div');
    main.className = 'scard-main';
    const nm = document.createElement('div'); nm.className = 'scard-name'; nm.textContent = s.name;
    const mt = document.createElement('div'); mt.className = 'scard-meta'; mt.textContent = stepSummary(s.body);
    main.append(nm, mt);
    main.onclick = () => openEditor(s.id);            /* tap card = edit */

    const runB = document.createElement('button');
    runB.className = 'scard-run'; runB.setAttribute('aria-label', 'Run ' + s.name);
    runB.innerHTML = PLAY + 'Run';
    runB.onclick = () => startRun(s.body, s.name);

    card.append(main, runB);
    cardsEl.appendChild(card);
  }
}
renderScriptList();

/* ---- editor UI ---- */
const edTitle = document.getElementById('edTitle');
const edName = document.getElementById('edName');
const edBody = document.getElementById('edBody');
const edDelete = document.getElementById('edDelete');
let editingId = null;

function showEditor(on) {
  editorPane.hidden = !on;
  listPane.hidden = on;
}
function openEditor(id) {
  editingId = id || null;
  if (editingId) {
    const s = scripts.find(x => x.id === editingId);
    edTitle.textContent = 'Edit script';
    edName.value = s.name; edBody.value = s.body;
    edDelete.hidden = false;
  } else {
    edTitle.textContent = 'New script';
    edName.value = ''; edBody.value = '';
    edDelete.hidden = true;
  }
  showEditor(true);
}

document.getElementById('newScriptBtn').onclick = () => openEditor(null);
document.getElementById('edBack').onclick = () => showEditor(false);
document.getElementById('edSave').onclick = () => {
  const name = edName.value.trim() || 'Untitled';
  const body = edBody.value;
  if (editingId) {
    const s = scripts.find(x => x.id === editingId);
    if (s) { s.name = name; s.body = body; }
  } else {
    scripts.push({id: uid(), name, body});
  }
  persist(); renderScriptList(); showEditor(false);
};
edDelete.onclick = () => {
  if (!editingId) return;
  const s = scripts.find(x => x.id === editingId);
  if (confirm('Delete "' + (s ? s.name : '') + '"?')) {
    scripts = scripts.filter(x => x.id !== editingId);
    persist(); renderScriptList(); showEditor(false);
  }
};
document.getElementById('restoreBtn').onclick = () => {
  scripts = scripts.concat(seedCopies());
  persist(); renderScriptList();
  toast('example scripts added');
};

/* ---------------- Touchpad (shared by Touchpad + Type tabs) ---------- */
const sens = document.getElementById('sens');

function sendMove(dx, dy) {
  dx = Math.max(-500, Math.min(500, Math.round(dx)));
  dy = Math.max(-500, Math.min(500, Math.round(dy)));
  if (dx || dy) send({t:'mouse', dx, dy, b: 0});
}
function clickButton(bit) {
  send({t:'mouse', dx:0, dy:0, b: bit});
  setTimeout(() => send({t:'mouse', dx:0, dy:0, b: 0}), 60);
}

function bindPad(el) {
  const pointers = new Map();   // id -> {x,y}
  let gestureMaxPointers = 0, gestureMoved = 0, gestureStart = 0;

  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();          /* don't steal focus (keeps the native
                                  * keyboard open on the Type tab) */
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pointers.size === 1) { gestureStart = Date.now(); gestureMoved = 0; }
    gestureMaxPointers = Math.max(gestureMaxPointers, pointers.size);
  });

  el.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    gestureMoved += Math.abs(dx) + Math.abs(dy);

    if (pointers.size === 1) {
      sendMove(dx * parseFloat(sens.value), dy * parseFloat(sens.value));
    } else if (pointers.size >= 2 && Math.abs(dy) > 4) {
      // two-finger vertical drag = scroll
      send({t:'mouse', dx:0, dy:0, b:0, w: dy > 0 ? 1 : -1});
    }
  });

  /* Tap type is decided once per gesture, when the last finger lifts, from
   * the peak concurrent touch count seen during the whole gesture — not
   * from how many fingers happen to still be down at that exact instant
   * (which would let a two-finger tap fire both a left AND a right click
   * as the two pointerup events land one after the other). */
  function padUp(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      const elapsed = Date.now() - gestureStart;
      if (gestureMoved < 14 && elapsed < 350) {
        clickButton(gestureMaxPointers >= 2 ? 2 : 1);
      }
      gestureMaxPointers = 0;
    }
  }
  el.addEventListener('pointerup', padUp);
  el.addEventListener('pointercancel', padUp);
}
bindPad(document.getElementById('pad'));
bindPad(document.getElementById('typepad'));

/* Pin the layout to the visual viewport so the on-screen keyboard
 * compresses the page (the typepad shrinks) instead of covering the
 * bottom controls — matters on iOS, which ignores interactive-widget. */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    document.body.style.height = vv.height + 'px';
    window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', fit);
}

document.getElementById('btnLeft').addEventListener('click', () => clickButton(1));
document.getElementById('btnRight').addEventListener('click', () => clickButton(2));
document.getElementById('btnMid').addEventListener('click', () => clickButton(4));
document.querySelectorAll('[data-scroll]').forEach(b => {
  b.addEventListener('click', () => send({t:'mouse', dx:0, dy:0, b:0, w: parseInt(b.dataset.scroll, 10)}));
});
</script>
